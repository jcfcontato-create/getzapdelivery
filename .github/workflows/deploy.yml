name: Publicar GetZap Delivery

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  publicar:
    runs-on: self-hosted
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Instalar dependencias do app
        working-directory: app
        run: npm ci

      - name: Gerar config.js com as credenciais de producao
        working-directory: app
        run: |
          cat > public/config.js << EOF
          window.__GZ_CONFIG__ = { supabaseUrl: "${{ secrets.VITE_SUPABASE_URL }}", supabaseKey: "${{ secrets.VITE_SUPABASE_ANON_KEY }}" }
          EOF

      - name: Buildar o app (cardapio + painel + admin)
        working-directory: app
        run: npm run build

      - name: Publicar os arquivos no servidor
        run: |
          mkdir -p "${{ secrets.VPS_PATH }}"
          rsync -avzr --delete app/dist/ "${{ secrets.VPS_PATH }}/"

      - name: Preparar CLI do Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ligar ao projeto Supabase
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Aplicar migracoes de banco pendentes
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Publicar a Edge Function admin-criar-loja
        run: supabase functions deploy admin-criar-loja --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}