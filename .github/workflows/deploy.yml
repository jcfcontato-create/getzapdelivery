name: Publicar GetZap Delivery

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do app
        working-directory: app
        run: npm ci

      - name: Gerar config.js com as credenciais de produção
        working-directory: app
        run: |
          cat > public/config.js << EOF
          window.__GZ_CONFIG__ = { supabaseUrl: "${{ secrets.VITE_SUPABASE_URL }}", supabaseKey: "${{ secrets.VITE_SUPABASE_ANON_KEY }}" }
          EOF

      - name: Buildar o app (cardápio + painel + admin)
        working-directory: app
        run: npm run build

      - name: Publicar os arquivos na VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: app/dist/
          remote_path: ${{ secrets.VPS_PATH }}/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Preparar CLI do Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ligar ao projeto Supabase
        working-directory: .
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Aplicar migrações de banco pendentes
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Publicar a Edge Function admin-criar-loja
        run: supabase functions deploy admin-criar-loja --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}