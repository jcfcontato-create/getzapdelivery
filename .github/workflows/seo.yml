name: Atualizar SEO das lojas

# Regera as páginas de SEO (cardápio em texto, Schema.org, sitemap) a cada 30 minutos,
# para que mudanças no cardápio feitas pelo painel cheguem ao Google sem precisar de deploy.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  seo:
    runs-on: self-hosted
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7
        with:
          sparse-checkout: tools

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Gerar páginas de SEO na pasta publicada
        run: node tools/gerar-seo.mjs "${{ secrets.VPS_PATH }}"
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
